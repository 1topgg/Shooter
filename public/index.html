<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Multiplayer Shooter</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0f; color: white; font-family: 'Courier New', monospace; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; font-size: 20px; text-shadow: 0 0 5px black; pointer-events: none; }
        #hp { color: #ff4444; font-weight: bold; font-size: 24px; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="hp">HP: 100</div>
        <div id="stats">Вбивств: 0 | Смертей: 0</div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script src="game.js"></script>
</body>
</html>
